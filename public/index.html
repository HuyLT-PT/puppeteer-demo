<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Crawl Comments</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body>
  <div id="app">
    <h1>🕵️ Crawl Comments</h1>
    <input v-model="companyName" placeholder="Enter company name" />
    <button @click="crawl">Crawl</button>
    <label>
      <input type="checkbox" v-model="autoScrollEnabled" @change="toggleAutoScroll" />
      🔄 Auto Scroll (Reading Mode)
    </label>
    <div style="margin: 10px 0;">
      <label>
        🕒 Scroll Speed (ms):
        <input :disabled="autoScrollEnabled"  type="number" v-model.number="scrollSpeed" min="1" max="50" />
      </label>
    </div>    
    <p v-if="loading">⏳ Crawling...</p>
    <p v-if="message">{{ message }}</p>
    <div ref="scrollContainer" style="max-height: 1000px; overflow-y: auto;">
    <table v-if="allComment && allComment?.length" border="1" cellpadding="8" cellspacing="0">
        <thead>
          <tr>
            <th>ID</th>
            <th>Text</th>
            <th>Type</th>
            <th>Source ID</th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="item in allComment" :key="item.id">
            <td>{{ item.id }}</td>
            <td>{{ item.text }}</td>
            <td>{{ item.type }}</td>
            <td>{{ item.sourceId }}</td>
          </tr>
        </tbody>
    </table>     
    </div> 
</div>

<script>
    const { createApp, ref, onMounted, nextTick, onUnmounted } = Vue;

    createApp({
      setup() {
        const companyName = ref('');
        const message = ref('');
        const allComment = ref([]);
        const loading = ref(false);

        const autoScrollEnabled = ref(false);
        const scrollContainer = ref(null);
        let scrollInterval = null;
        const scrollSpeed = ref(50);
        onMounted(() => {
          console.log('App is mounted!');
        });

        const toggleAutoScroll = () => {
        const speed = Math.min(Math.min(scrollSpeed.value, 50), 50);
        if (autoScrollEnabled.value) {
          scrollInterval = setInterval(() => {
            const el = scrollContainer.value;
            if (el) {
              el.scrollTop += 1; 
              if (el.scrollTop + el.clientHeight >= el.scrollHeight) {
                clearInterval(scrollInterval);
                autoScrollEnabled.value = false;
              }
              }
            }, speed); 
            } else {
            clearInterval(scrollInterval);
          }
        };

        onUnmounted(() => {
          clearInterval(scrollInterval);
        });

        const crawl = async () => {
          if (!companyName.value.trim()) {
            message.value = '⚠️ Please enter a company name.';
            return;
          }
          loading.value = true;
          message.value = '';
          try {
            const res = await fetch(`/crawl-comments/${encodeURIComponent(companyName.value)}`);
            const data = await res.json();
            message.value = data.message || '✅ Done!';
            if (Array.isArray(data.data)) {
                allComment.value.splice(0, allComment.value.length, ...data.data);
                nextTick(() => {
                console.log('DOM updated');
                console.log(allComment.value.length)
                });
            } else {
            console.error('Dữ liệu trả về không phải mảng!');
            }
          } catch (err) {
            message.value = '❌ Error occurred.';
          } finally {
            loading.value = false;
          }
        };

        return {
          companyName,
          message,
          loading,
          allComment,
          crawl,
          autoScrollEnabled,
          toggleAutoScroll,
          scrollContainer,
          scrollSpeed
        };
      }
    }).mount('#app');
</script>
</body>
</html>
